services:
  customer-db:
    image: postgres:18
    environment:
      POSTGRES_USER: customer_app
      POSTGRES_PASSWORD: customer_app_password
      POSTGRES_DB: customer_db
    ports:
      - "5433:5432" #Expose the customer database on port 5433
    volumes:
      - customer-db-data:/var/lib/postgresql

volumes:
  customer-db-data:
