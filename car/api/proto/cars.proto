syntax = "proto3";

package car.v1;

option go_package = "car-dealership/car/gen/v1;carv1";

service CarService {
  rpc AddCar(AddCarRequest) returns (AddCarResponse);
  rpc ListCars(ListCarsRequest) returns (ListCarsResponse);
}

message AddCarRequest {
  string brand = 1;
  string model = 2;
  int32 year = 3;
}

message Car {
  string id = 1;
  string brand = 2;
  string model = 3;
  int32 year = 4;
}

message AddCarResponse {
  string message = 1;
  Car car = 2;
}

message ListCarsRequest{}

message ListCarsResponse {
  repeated Car cars = 1;
}