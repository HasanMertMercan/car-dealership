syntax = "proto3";

package car.v1;

option go_package = "car-dealership/car/gen/v1;carv1";

service CarService {
  rpc UpsertCar(UpsertCarRequest) returns (UpsertCarResponse);
  rpc ListCars(ListCarsRequest) returns (ListCarsResponse);
}

message UpsertCarRequest {
  string id = 1;
  string brand = 2;
  string model = 3;
  int32 year = 4;
}

message Car {
  string id = 1;
  string brand = 2;
  string model = 3;
  int32 year = 4;
}

message UpsertCarResponse {
  string message = 1;
  Car car = 2;
}

message ListCarsRequest{}

message ListCarsResponse {
  repeated Car cars = 1;
}